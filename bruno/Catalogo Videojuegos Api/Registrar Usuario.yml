info:
  name: Registrar Usuario
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:8080/api/auth/register
  body:
    type: json
    data: |-
      {
          "nombre": "Usuario Prueba",
          "correo": "prueba@example.com",
          "password": "MiClaveSegura123!"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
